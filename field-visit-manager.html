<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>क्षेत्र भेट व्यवस्थापक - ग्राम महसूल अधिकारी निळा</title>
    <link rel="stylesheet" href="field-visit.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-wheat-awn"></i> ग्राम महसूल अधिकारी निळा
        </div>
        <ul class="navbar-links">
            <li>
                <a href="gpt.html" id="navbar-home">
                    <i class="fa-solid fa-house"></i> मुख्यपृष्ठ
                </a>
            </li>
            <li>
                <a href="field-visit-manager.html" class="active" id="navbar-visit">
                    <i class="fa-solid fa-clipboard-list"></i> क्षेत्र भेट
                </a>
            </li>
            <li>
                <a href="account.html" id="navbar-account">
                    <i class="fa-solid fa-user"></i> माझे खाते
                </a>
            </li>
            <li>
                <a href="#" id="navbar-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> बाहेर पडा
                </a>
            </li>
        </ul>
    </nav>

    <!-- HEADER -->
    <header>
        <div>
            <h1>
                <i class="fa-solid fa-map-location-dot"></i> क्षेत्र भेट नोंदणी
                <span id="totalVisitCount" class="header-stats">एकूण भेटी: --</span>
            </h1>
        </div>
        <div>
            <a href="field-visit.html" class="nav-btn">
                <i class="fa-solid fa-plus"></i> नवीन क्षेत्र भेट
            </a>
        </div>
    </header>

    <!-- SEARCH & CONTROLS -->
    <div class="manager-controls">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="शेतकऱ्याचे नाव किंवा गावावरून शोधा..."
            >
        </div>
    </div>

    <!-- VISIT CARDS CONTAINER -->
    <div id="visitContainer" class="card-container">
        <!-- Skeleton Loaders rendered by field-visit-manager.js -->
    </div>

    <script type="module" src="field-visit-manager.js"></script>
</body>
</html>
